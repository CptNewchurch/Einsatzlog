<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1A2E" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Farbschema vor dem ersten Zeichnen setzen, damit nichts aufblitzt.
      (function () {
        try {
          var wahl = localStorage.getItem('einsatzlog.theme') || 'system';
          var dunkel = wahl === 'dark' || (wahl !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dunkel ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dunkel ? '#0F1B30' : '#0E1A2E');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Persönliche Einsatzdokumentation für Rettungsdienst und Feuerwehr" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Einsatzlog</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
